<div class="screen-wrapper">
  <form class="registration-card" id="screeningForm">
    <!-- Header -->
    <div class="form-header">
      <h2>Athlete Screening & Eligibility</h2>
      <p>Complete the district verification profile to prevent age mismatches.</p>
    </div>

    <!-- Form Sections -->
    <div class="form-body">
      
      <!-- Section 1: Player Details -->
      <div class="form-section">
        <label class="section-title">Player Details</label>
        
        <div class="input-group">
          <label for="playerName">Full Name</label>
          <input type="text" id="playerName" required placeholder="e.g., John Doe" />
        </div>
        
        <div class="input-grid">
          <div class="input-group">
            <label for="playerDOB">Date of Birth</label>
            <input type="date" id="playerDOB" required />
          </div>
          <div class="input-group">
            <label for="schoolUnit">School / League Unit</label>
            <input type="text" id="schoolUnit" required placeholder="e.g., Hillside Primary" />
          </div>
        </div>
      </div>

      <hr class="section-divider" />

      <!-- Section 2: Parent / Guardian Info -->
      <div class="form-section">
        <label class="section-title">Parent/Guardian Verification</label>
        <div class="input-grid">
          <div class="input-group">
            <label for="guardianName">Guardian Name</label>
            <input type="text" id="guardianName" required placeholder="e.g., Jane Doe" />
          </div>
          <div class="input-group">
            <label for="guardianId">National ID / Passport Number</label>
            <input type="text" id="guardianId" required placeholder="e.g., ID-993821-K" />
          </div>
        </div>
      </div>

      <hr class="section-divider" />

      <!-- Section 3: Document Upload -->
      <div class="form-section">
        <label class="section-title">Eligibility Documentation</label>
        <p class="section-subtitle">Upload a clear photo of the student's ID card or official birth certificate.</p>
        
        <div class="drop-zone" id="idDropZone">
          <div class="drop-zone-prompt">
            <span class="upload-icon">📸</span>
            <p>Drag & drop Photo ID here or <span class="browse-link">click to browse</span></p>
            <span class="file-limits">Accepted formats: JPG, PNG (Max 2MB)</span>
          </div>
          <input type="file" id="idFileInput" accept="image/jpeg, image/png" style="display: none;" />
          <img src="" alt="ID Preview" class="id-preview-img" id="idPreview" style="display: none;" />
        </div>
        
        <div class="actions-bar" id="actionsBar" style="display: none;">
          <button type="button" class="btn-secondary" id="removeIdBtn">Remove Photo</button>
          <span class="status-badge">Document Attached</span>
        </div>
      </div>
      
    </div>

    <!-- Form Footer / Actions -->
    <div class="form-footer">
      <button type="submit" class="btn-primary">Verify & Register Athlete</button>
    </div>
  </form>
</div>
