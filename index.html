<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District Screening & Player Registration Platform</title>
    <style>
        /* ========================================== */
        /* GENERAL DASHBOARD LAYOUT & STYLING        */
        /* ========================================== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #334155;
        }

        .screening-dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Left Side Panel: Player Profile Card */
        .dashboard-sidebar {
            flex: 1;
            min-width: 300px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: center;
            height: fit-content;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #e2e8f0;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #64748b;
            border: 3px solid #cbd5e1;
        }

        .dashboard-sidebar h2 {
            margin: 10px 0 5px 0;
            color: #1e293b;
            font-size: 1.4rem;
        }

        .player-id-label {
            font-size: 0.85rem;
            color: #64748b;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Right Side Panel: Main Content Verification & Registration Form */
        .dashboard-main-content {
            flex: 2;
            min-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .verification-step-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .verification-step-card h3 {
            margin-top: 0;
            color: #1e293b;
            font-size: 1.15rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 10px;
        }

        /* Form Inputs Styling */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #334155;
            background-color: #f8fafc;
        }

        .form-group input:focus, .form-group select:focus {
            outline: 2px solid #2563eb;
            background-color: #ffffff;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Buttons Styling Layout */
        .form-actions-row {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action-approve { background: #2563eb; color: #ffffff; }
        .btn-action-approve:hover { background: #1d4ed8; }
        .btn-action-cancel { background: #cbd5e1; color: #475569; }
        .btn-action-cancel:hover { background: #64748b; }
        
        .btn-action-back { 
            background: #475569; 
            color: #ffffff; 
            max-width: 130px; 
        }
        .btn-action-back:hover { background: #334155; }


        /* ========================================== */
        /* VISUAL SCREENING STATUS DISPLAY STYLING    */
        /* ========================================== */
        .status-display-container {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .status-display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .status-display-container h3 {
            margin: 0;
            color: #1e293b;
            font-size: 1.1rem;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 20px;
            background: #e2e8f0;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .status-msg-box {
            background: #f8fafc;
            border-left: 4px solid #cbd5e1;
            border-radius: 6px;
            padding: 15px;
            min-height: 45px;
            display: flex;
            align-items: center;
            font-weight: 500;
            font-size: 0.95rem;
            color: #475569;
        }

        /* Visual Alert State Modifiers */
        .panel-verified {
            border-color: #10b981;
            background: #f0fdf4;
        }
        .panel-verified .status-badge { background: #d1fae5; color: #065f46; border-color: #10b981; }
        .panel-verified .status-msg-box { background: #ffffff; border-color: #10b981; color: #065f46; }

        .panel-flagged {
            border-color: #ef4444;
            background: #fef2f2;
            animation: panelGlow 1.5s infinite;
        }
        .panel-flagged .status-badge { background: #fee2e2; color: #991b1b; border-color: #ef4444; }
        .panel-flagged .status-msg-box { background: #ffffff; border-color: #ef4444; color: #991b1b; }

        .panel-hold {
            border-color: #f59e0b;
            background: #fffbeb;
        }
        .panel-hold .status-badge { background: #fef3c7; color: #92400e; border-color: #f59e0b; }
        .panel-hold .status-msg-box { background: #ffffff; border-color: #f59e0b; color: #92400e; }

        @keyframes panelGlow {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.2); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

    <form id="playerScreeningForm" onsubmit="event.preventDefault(); handleFinalSubmit();">
        
        <div class="screening-dashboard-container">

            <div class="dashboard-sidebar">
                <div class="profile-avatar" id="avatarBox">👤</div>
                <h2 id="displayPlayerName">New Participant</h2>
                <span class="player-id-label" id="displayPlayerDistrict">District Registry Terminal</span>
                
                <p style="font-size: 0.8rem; margin-top: 30px; color: #94a3b8; border-top: 1px solid #f1f5f9; padding-top: 15px;">
                    Tambuka Screening System v2.1
                </p>
            </div>

            <div class="dashboard-main-content">
                
                <div class="verification-step-card">
                    <h3>Player Registration Ledger Details</h3>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="playerNameInput">Full Legal Name</label>
                            <input type="text" id="playerNameInput" placeholder="Enter Full Name" value="Brian Ssenyondo" oninput="syncFormText()" required>
                        </div>
                        <div class="form-group">
                            <label for="playerDistrictInput">District / Region</label>
                            <select id="playerDistrictInput" onchange="syncFormText()">
                                <option value="Kampala Central">Kampala Central</option>
                                <option value="Wakiso District">Wakiso District</option>
                                <option value="Gulu City">Gulu City</option>
                                <option value="Mbarara District">Mbarara District</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="playerDOB">Date of Birth (For Age Screening)</label>
                            <input type="date" id="playerDOB" value="2009-04-12" required>
                        </div>
                        <div class="form-group">
                            <label for="playerPhotoFile">Upload Verification Photo</label>
                            <input type="file" id="playerPhotoFile" accept="image/*">
                        </div>
                    </div>
                </div>

                <div class="verification-step-card">
                    <h3>Biometric Screening Verification Parameters</h3>
                    
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="digitalIdCheck" checked> Government / School Digital ID Matches Data
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="biometricFaceCheck" checked> Biometric Face Match Verified (Tambuka Match Engine)
                        </label>
                        <label class="checkbox-label" style="color: #b91c1c; font-weight: 600;">
                            <input type="checkbox" id="ageCheatCheck"> FLAG TARGET FOR AGE CHEATING / SUSPICION ALARM
                        </label>
                    </div>
                </div>

                <div class="status-display-container" id="statusDisplayPanel">
                    <div class="status-display-header">
                        <h3>Screening Status Matrix</h3>
                        <span class="status-badge" id="panelBadge">STANDBY</span>
                    </div>
                    
                    <div class="status-msg-box" id="panelMsgBox">
                        System standing by. Complete verification metrics or commit entry to determine ledger status.
                    </div>
                </div>
                <div class="form-actions-row">
                    <button type="button" class="btn-action btn-action-back" onclick="goBackToPreviousPage()">⬅️ Back</button>
                    <button type="button" class="btn-action btn-action-cancel" onclick="handleHold()">Hold Entry</button>
                    <button type="submit" class="btn-action btn-action-approve">Commit & Verify Player</button>
                </div>

            </div>
        </div>
    </form>

    <script>
        // Synchronize inputs dynamically to update the sidebar layout card
        function syncFormText() {
            const nameInput = document.getElementById('playerNameInput').value;
            const districtInput = document.getElementById('playerDistrictInput').value;
            
            document.getElementById('displayPlayerName').textContent = nameInput ? nameInput : "New Participant";
            document.getElementById('displayPlayerDistrict').textContent = "District: " + districtInput;
        }

        // Initialize display context on page load
        syncFormText();

        // Dashboard Back Button Router Function 
        function goBackToPreviousPage() {
            window.history.back();
        }

        /**
         * State Machine Updates
         * Visually changes dashboard cards based on the evaluation result
         */
        function updateVisualPanel(state, message) {
            const panel = document.getElementById('statusDisplayPanel');
            const badge = document.getElementById('panelBadge');
            const msgBox = document.getElementById('panelMsgBox');

            // Reset dynamic modifier classes
            panel.classList.remove('panel-verified', 'panel-flagged', 'panel-hold');

            if (state === 'verified') {
                panel.classList.add('panel-verified');
                badge.textContent = "VERIFIED";
                msgBox.innerHTML = "✅ " + message;
            } else if (state === 'flagged') {
                panel.classList.add('panel-flagged');
                badge.textContent = "ALERT FLAGGED";
                msgBox.innerHTML = "🚨 " + message;
            } else if (state === 'hold') {
                panel.classList.add('panel-hold');
                badge.textContent = "ENTRY ON HOLD";
                msgBox.innerHTML = "⏳ " + message;
            }
        }

        // Triggered upon pressing 'Commit & Verify Player'
        function handleFinalSubmit() {
            const name = document.getElementById('playerNameInput').value || "Participant";
            const ageCheatChecked = document.getElementById('ageCheatCheck').checked;

            if (ageCheatChecked) {
                updateVisualPanel('flagged', `CRITICAL ACCUSATION: Registration for ${name} has been rejected due to age discrepancies or duplicate token indicators.`);
            } else {
                updateVisualPanel('verified', `SUCCESS: Entry for ${name} cleared. Data compiled and logged into the secure tournament register.`);
            }
        }

        // Triggered upon pressing 'Hold Entry'
        function handleHold() {
            const name = document.getElementById('playerNameInput').value || "Participant";
            updateVisualPanel('hold', `PENDING: Screening for ${name} suspended. Awaiting additional validation documentation.`);
        }
    </script>
</body>
</html>
