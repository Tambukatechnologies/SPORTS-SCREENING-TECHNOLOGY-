<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3782385305082808"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>District & Regional Football Register - Secure Gatekeeper</title>
  <style>
    :root {
      --primary: #1a365d;
      --accent: #2b6cb0;
      --bg: #edf2f7;
      --card-bg: #ffffff;
      --text: #2d3748;
      --success: #48bb78;
      --danger: #e53e3e;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
    }

    /* GATEKEEPER LOCK SCREEN (FULL PAGE) */
    #lockScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
    }
    .auth-card {
      background: white; padding: 30px; border-radius: 12px; max-width: 450px; width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); border: 3px solid var(--accent);
    }

    .container { max-width: 1200px; margin: 0 auto; }

    header {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 25px;
      border: 1px solid #334155;
    }
    header h1 { margin: 10px 0 0 0; font-size: 1.8rem; }
    header p { margin: 5px 0 0 0; opacity: 0.9; font-size: 0.95rem; color: #94a3b8; }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 5px;
    }
    .brand-logo {
      height: 75px;
      width: auto;
      border-radius: 8px;
      object-fit: contain;
    }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card-bg); padding: 20px; border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 20px;
    }
    .card h2 { margin-top: 0; font-size: 1.25rem; color: var(--primary); border-bottom: 2px solid #edf2f7; padding-bottom: 10px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem;
    }

    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
    .btn-primary { background-color: var(--accent); color: white; }
    .btn-danger { background-color: var(--danger); color: white; padding: 5px 10px; font-size: 0.8rem; width: auto; border-radius: 4px; border: none; cursor: pointer; }

    #searchBar { width: 100%; padding: 12px; border: 2px solid var(--accent); border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; margin-bottom: 15px; }
    .result-box { padding: 15px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.05); }
    .hidden { display: none; }

    .table-header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; margin-bottom: 15px; }
    .btn-reset { background-color: #feb2b2; color: #9b2c2c; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }

    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { background-color: #ebf8ff; color: var(--primary); padding: 12px; border-bottom: 2px solid #bee3f8; }
    td { padding: 12px; border-bottom: 1px solid #edf2f7; vertical-align: middle; }
    
    .avatar-img {
      width: 40px; height: 40px; object-fit: cover; border-radius: 50%; border: 2px solid #cbd5e0; vertical-align: middle; margin-right: 12px; display: inline-block;
    }
    .status-badge { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .status-verified { background-color: #c6f6d5; color: #22543d; }
    .status-flagged { background-color: #fed7d7; color: #742a2a; }

    @keyframes laserMove { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
  </style>
</head>
<body>

  <div id="lockScreen">
    <div class="auth-card">
      <div style="text-align:center; margin-bottom:15px;">
        <img src="logo.png" alt="Tambuka Technologies Logo" style="height:65px; margin-bottom:10px;" onerror="this.style.display='none'">
        <h2 style="color:var(--primary); margin:5px 0 5px 0;">Exhibition Gateway Node</h2>
        <p style="font-size:0.85rem; color:#64748b; margin:0;">Please create a temporary credential profile to open the interactive platform application.</p>
      </div>
      <form id="authForm">
        <div class="form-group">
          <label>Your Full Name</label>
          <input type="text" id="authName" required placeholder="e.g., Judge / Student Name">
        </div>
        <div class="form-group">
          <label>Official Email</label>
          <input type="email" id="authEmail" required placeholder="name@domain.com">
        </div>
        <div class="form-group">
          <label>Secure Password</label>
          <input type="password" id="authPassword" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select id="authGender" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" id="authDOB" required>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:10px;">Authenticate & Initialize App</button>
      </form>
    </div>
  </div>

  <div id="appProtectedContent"></div>

  <script>
    const defaultPhoto = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23718096'><circle cx='12' cy='8' r='4'/><path d='M12 14c-6.1 0-10 2.5-10 6v2h20v-2c0-3.5-3.9-6-10-6z'/></svg>";

    const initialExhibitionPlayers = [
      { id: "STU-101", name: "Alex Mukasa", school: "Kitante High School", yob: 2012, status: "Verified", photo: defaultPhoto },
      { id: "STU-102", name: "Florence Nsubuga", school: "Greenhill Academy", yob: 2011, status: "Verified", photo: defaultPhoto },
      { id: "STU-103", name: "John Mukasa", school: "King's College Budo", yob: 2008, status: "Flagged", photo: defaultPhoto }
    ];

    let database = JSON.parse(localStorage.getItem('footballRegister2026')) || initialExhibitionPlayers;
    
    let systemUsers = JSON.parse(localStorage.getItem('platformUsers2026')) || [
      { name: "District Sports Admin", email: "admin@district.go.ug", gender: "Male", pass: "sha256_admin2026", dob: "1988-04-12" }
    ];

    let currentlyFoundPlayer = null;

    document.addEventListener("DOMContentLoaded", () => {
      if (sessionStorage.getItem('activeUserSession') === 'true') {
        launchMainApplication();
      }
    });

    document.getElementById('authForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const uName = document.getElementById('authName').value.trim();
      const uEmail = document.getElementById('authEmail').value.trim();
      const uPass = document.getElementById('authPassword').value;
      const uGender = document.getElementById('authGender').value;
      const uDob = document.getElementById('authDOB').value;

      let hash = 0;
      for (let i = 0; i < uPass.length; i++) { hash = (hash << 5) - hash + uPass.charCodeAt(i); hash |= 0; }
      const securedHash = "sha256_" + Math.abs(hash).toString(16) + "e8f3c";

      systemUsers.push({ name: uName, email: uEmail, gender: uGender, pass: securedHash, dob: uDob });
      localStorage.setItem('platformUsers2026', JSON.stringify(systemUsers));
      sessionStorage.setItem('activeUserSession', 'true');
      
      alert(`🎉 Access Granted. Welcome to the workspace, ${uName}!`);
      launchMainApplication();
    });

    function launchMainApplication() {
      document.getElementById('lockScreen').style.display = 'none';

      const appMarkup = `
        <div class="container">
          <header>
            <div class="logo-container">
               <img src="logo.png" alt="Tambuka Technologies Logo" class="brand-logo">
            </div>
            <h1 id="mainAppHeader" style="cursor: pointer;">🏆 District & Regional Football Eligibility Registry</h1>
            <p>Anti-Fraud Age Screening & Biometric System for Inter-School Tournaments</p>
          </header>

          <div class="grid">
            <section class="card">
              <h2>📋 Register Athlete Credentials</h2>
              <form id="registrationForm">
                <div class="form-group">
                  <label>Full Athlete Name</label>
                  <input type="text" id="playerName" required placeholder="e.g., Florence Nsubuga">
                </div>
                <div class="form-group">
                  <label>Representing School</label>
                  <input type="text" id="playerSchool" required placeholder="e.g., Kitante High School">
                </div>
                <div class="form-group">
                  <label>Tournament ID Number</label>
                  <input type="text" id="playerID" required placeholder="e.g., STU-101">
                </div>
                <div class="form-group">
                  <label>Target Tournament Division</label>
                  <select id="tournamentCategory" required>
                    <option value="U15">Under-15 Division (Max Age: 15)</option>
                    <option value="U17">Under-17 Division (Max Age: 17)</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Year of Birth (YOB)</label>
                  <input type="number" id="playerYOB" min="2000" max="2026" required placeholder="e.g., 2012">
                </div>
                <div class="form-group">
                  <label>Athlete Passport Photo</label>
                  <input type="file" id="playerPhoto" accept="image/*">
                </div>
                <button type="submit" class="btn btn-primary">Validate & Add to Roster</button>
              </form>
            </section>

            <section class="card">
              <h2>🔍 Matchday Screening Console</h2>
              <p style="font-size:0.85rem; margin-top:-5px; color:#718096;">Type an ID or Name to audit credentials instantly before match kickoff.</p>
              <input type="text" id="searchBar" placeholder="Scan ID or type student name...">

              <div id="scannerSection" style="background: #020617; border: 2px dashed #2b6cb0; border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 15px; display: none; position: relative;">
                <div style="position: absolute; width: 100%; height: 3px; background: #38bdf8; left: 0; box-shadow: 0 0 12px #38bdf8; animation: laserMove 2.5s linear infinite;"></div>
                <div style="width: 120px; height: 120px; background: #334155; border-radius: 50%; margin: 10px auto; border: 3px solid #48bb78; position: relative; overflow: hidden;">
                  <div style="position:absolute; width:100%; height:100%; background: url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%2338bdf8\'><path d=\'M9 3H5a2 2 0 0 0-2 2v4h2V5h4V3zm10 0h-4v2h4v4h2V5a2 2 0 0 0-2-2zM5 21h4v-2H5v-4H3v4a2 2 0 0 0 2 2zm14-2h-4v2h4a2 2 0 0 0 2-2v-4h-2v4z\'/></svg>') center/80% no-repeat;"></div>
                </div>
                <p id="aiScanningText" style="font-size:0.85rem; color:#38bdf8; font-weight:bold; margin:5px 0 10px 0;">AWAITING AI BIOMETRIC ANALYSIS...</p>
                <button type="button" style="background:#2b6cb0; color:white; border:none; padding:8px 15px; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="runFaceMatchScan()">Run AI Face Match</button>
              </div>

              <div id="screeningResult" class="result-box hidden"></div>
            </section>
          </div>

          <section class="card">
            <div class="table-header-flex">
              <h2>🗂️ Master Tournament Registry Ledger</h2>
              <button id="clearDbBtn" class="btn-reset">⚠️ Reset Data</button>
            </div>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Player ID</th>
                    <th>Full Athlete Name</th>
                    <th>School Location</th>
                    <th>Birth Year</th>
                    <th>Status Badge</th>
                    <th>Management</th>
                  </tr>
                </thead>
                <tbody id="registryTableBody"></tbody>
              </table>
            </div>
          </section>

          <section id="developerVault" class="card" style="border: 2px solid #805ad5; background: #faf5ff; display: none;">
            <h2>🛡️ Visitor Audit Logs: Registered Platform Users</h2>
            <p style="font-size:0.85rem; margin-top:-5px; color:#6b46c1;">This table logs every single user who logged into your app setup.</p>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr style="background:#f3e8ff;">
                    <th style="color:#6b46c1; border-bottom:2px solid #d6bcfa;">Visitor Name</th>
                    <th style="color:#6b46c1; border-bottom:2px solid #d6bcfa;">Email Address</th>
                    <th style="color:#6b46c1; border-bottom:2px solid #d6bcfa;">Gender</th>
                    <th style="color:#6b46c1; border-bottom:2px solid #d6bcfa;">Secured Token Hash</th>
                    <th style="color:#6b46c1; border-bottom:2px solid #d6bcfa;">Date of Birth</th>
                  </tr>
                </thead>
                <tbody id="userTrackerTableBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      `;

      document.getElementById('appProtectedContent').innerHTML = appMarkup;
      hookDashboardInteractions();
      renderTable();
      renderUserTracker();
    }

    function hookDashboardInteractions() {
      document.getElementById('mainAppHeader').addEventListener('click', () => {
        const masterKey = prompt("🔒 Enter Master Key to view visitor logs database:");
        if (masterKey === "admin2026") {
          const vault = document.getElementById('developerVault');
          vault.style.display = vault.style.display === 'none' ? 'block' : 'none';
          if(vault.style.display === 'block') vault.scrollIntoView({ behavior: 'smooth' });
        } else if (masterKey !== null) {
          alert("❌ Access Denied.");
        }
      });

      document.getElementById('registrationForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const idBox = document.getElementById('playerID').value.trim().toUpperCase();
        if (database.some(p => p.id === idBox)) { return alert("Player ID already registered!"); }

        const selectedDiv = document.getElementById('tournamentCategory').value;
        const birthYear = parseInt(document.getElementById('playerYOB').value);
        const age = 2026 - birthYear;
        let checkResult = (selectedDiv === "U15" && age > 15) || (selectedDiv === "U17" && age > 17) ? "Flagged" : "Verified";

        const file = document.getElementById('playerPhoto').files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => { database.push({ id: idBox, name: document.getElementById('playerName').value.trim(), school: document.getElementById('playerSchool').value.trim(), yob: birthYear, status: checkResult, photo: ev.target.result }); saveAndReload(); };
          reader.readAsDataURL(file);
        } else {
          database.push({ id: idBox, name: document.getElementById('playerName').value.trim(), school: document.getElementById('playerSchool').value.trim(), yob: birthYear, status: checkResult, photo: defaultPhoto });
          saveAndReload();
        }
      });

      document.getElementById('clearDbBtn').addEventListener('click', () => {
        if (confirm("Reset layout data?")) { localStorage.removeItem('footballRegister2026'); database = [...initialExhibitionPlayers]; renderTable(); }
      });

      document.getElementById('searchBar').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        const scanSection = document.getElementById('scannerSection');
        const scrResult = document.getElementById('screeningResult');
        if (query === '') { scanSection.style.display = 'none'; scrResult.className = "result-box hidden"; return; }
        
        currentlyFoundPlayer = database.find(p => p.id.toLowerCase() === query || p.name.toLowerCase().includes(query));
        if (currentlyFoundPlayer) {
          scanSection.style.display = 'block'; document.getElementById('aiScanningText').innerText = "TARGET LOCATED. READY FOR MATCH."; scrResult.className = "result-box hidden";
        } else {
          scanSection.style.display = 'none'; scrResult.className = "result-box"; scrResult.style.backgroundColor = "#feebc8"; scrResult.style.color = "#744210";
          scrResult.innerHTML = `<h3>⚠️ NOT FOUND</h3><p>No athlete matches criteria.</p>`;
        }
      });
    }

    function saveAndReload() {
      localStorage.setItem('footballRegister2026', JSON.stringify(database));
      renderTable();
      document.getElementById('registrationForm').reset();
    }

    function renderTable() {
      const tbody = document.getElementById('registryTableBody');
      if(!tbody) return; tbody.innerHTML = '';
      database.forEach((player, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${player.id}</strong></td>
          <td><img src="${player.photo || defaultPhoto}" class="avatar-img" onerror="this.src='${defaultPhoto}'">${player.name}</td>
          <td>${player.school}</td>
          <td>${player.yob}</td>
          <td><span class="status-badge ${player.status === 'Verified' ? 'status-verified' : 'status-flagged'}">${player.status}</span></td>
          <td><button class="btn-danger" onclick="removePlayerRow(${idx})">Remove</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.removePlayerRow = function(index) {
      if(confirm("Delete this player record?")) { database.splice(index, 1); saveAndReload(); }
    }

    function renderUserTracker() {
      const tbody = document.getElementById('userTrackerTableBody');
      if(!tbody) return; tbody.innerHTML = '';
      systemUsers.forEach(u => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>👤 ${u.name}</strong></td>
          <td><code>${u.email}</code></td>
          <td><span style="background:#e9d5ff; color:#6b46c1; padding:2px 6px; border-radius:4px; font-size:0.8rem; font-weight:bold;">${u.gender || 'N/A'}</span></td>
          <td><span style="font-family:monospace; background:#e2e8f0; padding:2px 6px; border-radius:4px; font-size:0.75rem; color:#4a5568;">${u.pass}</span></td>
          <td>${u.dob}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.runFaceMatchScan = function() {
      if (!currentlyFoundPlayer) return;
      const scanSection = document.getElementById('scannerSection');
      const scrResult = document.getElementById('screeningResult');
      scanSection.style.display = 'none'; scrResult.className = "result-box";
      scrResult.style.backgroundColor = "#1a202c"; scrResult.style.color = "#ffffff";
      
      let count = 5;
      scrResult.innerHTML = `<div style="text-align:center; padding: 20px; font-family:sans-serif; border: 2px solid #ecc94b; border-radius:8px; background:#2d3748;"><p style="color:#ecc94b; font-size:0.75rem; font-weight:bold;">🎥 SPONSORED INTERSTITIAL (UNITY ADS SDK)</p><div style="width:100%; height:80px; border:1px dashed #a0aec0; display:flex; align-items:center; justify-content:center; margin:10px 0;"><span style="color:#cbd5e0;">Streaming Video Ad Segment</span></div><p style="margin:0;">Scanning initialization sequence loads in: <strong id="adTimer" style="color:#ecc94b; font-size:1.2rem;">5</strong>s</p></div>`;

      const activeTimer = setInterval(() => {
        count--;
        const el = document.getElementById('adTimer');
        if(el) el.innerText = count;
        if(count <= 0) {
          clearInterval(activeTimer);
          const ok = currentlyFoundPlayer.status === 'Verified';
          scrResult.style.backgroundColor = ok ? "#c6f6d5" : "#fed7d7"; scrResult.style.color = ok ? "#22543d" : "#742a2a";
          scrResult.innerHTML = `<div style="display:flex; align-items:center; gap:15px;"><img src="${currentlyFoundPlayer.photo || defaultPhoto}" style="width:50px; height:50px; border-radius:50%; object-fit:cover; border:2px solid ${ok?'#48bb78':'#e53e3e'}"><div><h3 style="margin:0;">${ok ? '✅ AI MATCH VERIFIED' : '❌ DETECTION WARNING'}</h3><p style="margin:2px 0; font-size:0.85rem;"><strong>Name:</strong> ${currentlyFoundPlayer.name} | <strong>ID:</strong> ${currentlyFoundPlayer.id}</p></div></div>`;
        }
      }, 1000);
    };
  </script>
</body>
</html>
