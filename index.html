<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District Screening & Player Registration Platform</title>
    <style>
        /* ========================================== */
        /* GENERAL DASHBOARD LAYOUT & STYLING        */
        /* ========================================== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #334155;
        }

        .screening-dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Left Side Panel: Player Profile Card */
        .dashboard-sidebar {
            flex: 1;
            min-width: 300px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: center;
            height: fit-content;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #e2e8f0;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #64748b;
            border: 3px solid #cbd5e1;
        }

        .dashboard-sidebar h2 {
            margin: 10px 0 5px 0;
            color: #1e293b;
            font-size: 1.4rem;
        }

        .player-id-label {
            font-size: 0.85rem;
            color: #64748b;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Right Side Panel: Main Content Verification & Registration Form */
        .dashboard-main-content {
            flex: 2;
            min-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .verification-step-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .verification-step-card h3 {
            margin-top: 0;
            color: #1e293b;
            font-size: 1.15rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 10px;
        }

        /* Form Inputs Styling */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #334155;
            background-color: #f8fafc;
        }

        .form-group input:focus, .form-group select:focus {
            outline: 2px solid #2563eb;
            background-color: #ffffff;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Buttons Styling Layout */
        .form-actions-row {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action-approve { background: #2563eb; color: #ffffff; }
        .btn-action-approve:hover { background: #1d4ed8; }
        .btn-action-cancel { background: #cbd5e1; color: #475569; }
        .btn-action-cancel:hover { background: #64748b; }
        
        .btn-action-back { 
            background: #475569; 
            color: #ffffff; 
            max-width: 130px; 
        }
        .btn-action-back:hover { background: #334155; }

        /* ========================================== */
        /* VISUAL SCREENING STATUS DISPLAY STYLING    */
        /* ========================================== */
        .status-display-container {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .status-display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .status-display-container h3 {
            margin: 0;
            color: #1e293b;
            font-size: 1.1rem;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 20px;
            background: #e2e8f0;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .status-msg-box {
            background: #f8fafc;
            border-left: 4px solid #cbd5e1;
            border-radius: 6px;
            padding: 15px;
            min-height: 45px;
            display: flex;
            align-items: center;
            font-weight: 5
